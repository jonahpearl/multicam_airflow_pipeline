validation_videos:
  max_frames: 7200  # 1 min @ 120 fps
  # max_frames: 240

o2:
  sync_cameras:
    o2_memory: "2G"
    o2_n_cpus: 1
    o2_queue: "short"
    o2_runtime_multiplier: 0.05
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  sync_ephys:
    o2_memory: "16G"
    o2_n_cpus: 1
    o2_queue: "short"
    o2_runtime_multiplier: 1
    conda_env: "/n/groups/datta/tim_sainburg/conda_envs/peromoseq"

  camera_calibration:
    o2_memory: "10G"
    o2_n_cpus: 10
    o2_queue: "short"
    o2_time_limit: "2:00:00"
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  compression:
    o2_memory: "2G"
    o2_n_cpus: 6
    o2_queue: "short"
    o2_runtime_multiplier: 6
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/dataPy_NWB2/"

  prediction_2d:
    o2_memory: "6G"
    o2_n_cpus: 4
    o2_queue: "gpu_quad,gpu"
    o2_runtime_multiplier: 12
    # o2_exclude: "compute-g-16-175,compute-g-16-176,compute-g-16-177,compute-g-16-194,compute-g-16-197,compute-g-16-254,compute-g-16-255"
    o2_exclude: "compute-g-16-254,compute-g-16-255"
    o2_qos: "gpuquad_qos"
    o2_gres: "gpu:1"
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  spikesorting:
    o2_memory: "64G"
    o2_n_cpus: 20
    o2_queue: "gpu_quad,gpu"
    o2_runtime_multiplier: 4
    # o2_exclude: "compute-g-16-175,compute-g-16-176,compute-g-16-177,compute-g-16-194,compute-g-16-197"
    o2_exclude: "compute-g-16-254,compute-g-16-255"
    o2_qos: "gpuquad_qos"
    o2_gres: "gpu:1"
    conda_env: "/n/groups/datta/tim_sainburg/conda_envs/kilosort4"

  gimbal:
    o2_memory: "8G"
    o2_n_cpus: 2
    o2_queue: "gpu_quad,gpu"
    o2_runtime_multiplier: 0.75
    # o2_exclude: "compute-g-16-175,compute-g-16-176,compute-g-16-177,compute-g-16-194,compute-g-16-197,compute-g-16-254,compute-g-16-255"  # tesla V100's on the 16-254/255 nodes aren't working with the jax 0.4 / cuda 12 install
    o2_exclude: "compute-g-16-254,compute-g-16-255"
    o2_qos: "gpuquad_qos"
    o2_gres: "gpu:1"
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/dataPy_KPMS_GIMBAL"
  
  triangulation:
    o2_memory: "8G"
    o2_n_cpus: 10  # these cores are used efficiently
    o2_queue: "short"
    o2_runtime_multiplier: 0.25
    # conda_env: "/n/groups/datta/tim_sainburg/conda_envs/peromoseq"
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/dataPy_NWB2/"

  size_normalization:
      o2_memory: "10G"
      o2_n_cpus: 3  # using about 50% cpu efficiency
      o2_queue: "short"
      o2_runtime_multiplier: 0.5
      conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  arena_alignment:
      o2_memory: "2G"
      o2_n_cpus: 1
      o2_queue: "short"
      o2_runtime_multiplier: 0.05
      conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  egocentric_alignment:
    o2_memory: "8G"
    o2_n_cpus: 1
    o2_queue: "short"
    o2_runtime_multiplier: 0.2
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  continuous_features:
    o2_memory: "1G"
    o2_n_cpus: 1
    o2_queue: "short"
    o2_runtime_multiplier: 0.025
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"

  validation_videos:
    o2_memory: "4G"
    o2_n_cpus: 1
    o2_queue: "short"
    o2_time_limit: "2:30:00"  # writes ~30 fps, so if we default to 1 min @ 120 fps -> 7200 fr -> 4 min x 6 vids x 2 types of vid = ~ 1 hr, + compressing takes ~1 hr more.
    conda_env: "/n/groups/datta/Jonah/miniconda3/envs/mmdeploy_JP_v4"
